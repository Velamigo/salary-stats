<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💵 我的工资 · 看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
<style>
:root {
  --green: #1ed760; --green-deep: #169c46;
  --red: #f3727f; --orange: #ffa42b; --blue: #539df5;
  --bg: #121212; --surface: #181818; --surface2: #1f1f1f; --elev: #282828;
  --text: #ffffff; --muted: #b3b3b3; --faint: #7c7c7c;
  --hairline: rgba(255,255,255,0.07);
  --shadow-card: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-pop: 0 8px 24px rgba(0,0,0,0.5);
  --accent: var(--green); --accent-ink: #000;
}
[data-theme="light"] {
  --bg: #f6f7f8; --surface: #ffffff; --surface2: #f0f1f2; --elev: #e7e8ea;
  --text: #121212; --muted: #5a5c5e; --faint: #9a9da0;
  --hairline: rgba(0,0,0,0.07);
  --shadow-card: 0 4px 16px rgba(0,0,0,0.07);
  --shadow-pop: 0 8px 24px rgba(0,0,0,0.14);
  --accent: var(--green-deep); --accent-ink: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scrollbar-color: var(--elev) transparent; }
body {
  font-family: 'DM Sans', -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  transition: background .25s, color .25s;
  font-variant-numeric: tabular-nums;
}
button { font-family: inherit; }
/* ---------- pills & chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; cursor: pointer; border-radius: 999px;
  background: var(--surface2); color: var(--muted);
  font-size: 13px; font-weight: 700; padding: 8px 16px;
  transition: transform .12s, background .15s, color .15s;
  white-space: nowrap; user-select: none;
}
.pill:hover { background: var(--elev); color: var(--text); }
.pill:active { transform: scale(.96); }
.pill.on { background: var(--accent); color: var(--accent-ink); }
.pill.on:hover { background: var(--accent); filter: brightness(1.08); color: var(--accent-ink); }
.pill.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--faint); }
.pill.ghost:hover { background: var(--surface2); }
.chip {
  display: inline-flex; align-items: center; border-radius: 999px;
  background: var(--surface2); color: var(--muted);
  font-size: 11px; font-weight: 700; padding: 3px 10px; letter-spacing: .3px;
}
/* ---------- login ---------- */
#loginScreen {
  min-height: 100vh; display: none; align-items: center; justify-content: center;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(30,215,96,0.13), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(83,157,245,0.08), transparent 60%),
    var(--bg);
  padding: 24px;
}
.login-box {
  background: var(--surface); border-radius: 16px; padding: 40px 32px 32px;
  width: 100%; max-width: 380px; box-shadow: var(--shadow-pop); text-align: center;
}
.login-logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 26px; box-shadow: 0 8px 24px rgba(30,215,96,.35); }
.login-box h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -.3px; }
.login-box p { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
.login-input {
  width: 100%; padding: 14px 18px; border-radius: 999px; border: none;
  background: var(--surface2); color: var(--text); font-size: 15px; margin-bottom: 12px;
  box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s; text-align: center; letter-spacing: 2px;
}
.login-input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--faint); }
.login-btn {
  width: 100%; padding: 14px; border-radius: 999px; border: none;
  background: var(--accent); color: var(--accent-ink);
  font-size: 14px; font-weight: 700; cursor: pointer;
  letter-spacing: 1.6px; text-transform: uppercase; transition: filter .15s, transform .1s;
}
.login-btn:hover { filter: brightness(1.08); }
.login-btn:active { transform: scale(.98); }
.login-error { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; font-weight: 600; }
.login-forgot { margin-top: 14px; font-size: 13px; }
.login-forgot a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--faint); padding-bottom: 1px; }
.login-forgot a:hover { color: var(--text); }
/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(18,18,18,0.82);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--hairline);
}
[data-theme="light"] .topbar { background: rgba(246,247,248,0.85); }
.topbar-in { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: -.2px; margin-right: auto; }
.brand-dot { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 17px; }
.seg { display: flex; gap: 4px; background: var(--surface2); border-radius: 999px; padding: 4px; }
.seg .pill { padding: 6px 14px; font-size: 12.5px; background: transparent; }
.seg .pill:hover { background: var(--elev); }
.seg .pill.on { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--surface2); color: var(--text); font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background .15s, transform .1s; }
.icon-btn:hover { background: var(--elev); }
.icon-btn:active { transform: scale(.94); }
/* ---------- layout ---------- */
.app { display: none; }
.page { max-width: 1080px; margin: 0 auto; padding: 22px 20px 80px; }
.section-label { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.section-label:first-child { margin-top: 4px; }
.section-label h3 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.section-label .sub { font-size: 12px; color: var(--faint); font-weight: 500; }
/* ---------- hero ---------- */
.hero-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; }
.hero-card {
  position: relative; overflow: hidden; border-radius: 16px;
  background: var(--surface); box-shadow: var(--shadow-card); padding: 22px 24px 14px;
}
.hero-card.net {
  background:
    radial-gradient(900px 300px at 85% -50%, rgba(30,215,96,0.16), transparent 65%),
    var(--surface);
}
.hero-top { display: flex; align-items: flex-start; gap: 16px; }
.hero-top > div:first-child { flex: 1; }
.hero-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 8px; }
.hero-nums { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 26px; }
.hn { font-size: 14px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: baseline; gap: 7px; }
.hn i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.hn-net i { background: var(--green); box-shadow: 0 0 8px rgba(30,215,96,.6); }
.hn-gross i { background: #b3b3b3; }
.hn b { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.8px; color: var(--text); }
.hn-net b { color: var(--green); }
.hn em { font-style: normal; font-size: 12.5px; font-weight: 700; margin-left: 4px; }
.hn em.up { color: var(--green); } .hn em.down { color: var(--red); }
.hero-gap { text-align: right; background: var(--surface2); border-radius: 12px; padding: 10px 16px; }
.hero-gap .k { font-size: 10.5px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.hero-gap .v { font-size: 20px; font-weight: 800; color: var(--orange); }
.dual-svg { display: block; }
.spark-holder { min-height: 56px; }
.dual-holder { min-height: 170px; margin-top: 10px; }
.dual-legend { display: flex; align-items: center; gap: 20px; padding: 6px 2px 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.dual-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
.dual-legend .lg-net { background: var(--green); } .dual-legend .lg-gross { background: #b3b3b3; }
.dual-legend .lg-soc { background: #539df5; } .dual-legend .lg-tax { background: #ffa42b; }
.dual-legend .lg-hint { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 11px; }
.hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hairline); border-radius: 12px; overflow: hidden; margin-top: 14px; }
.hs-cell { background: var(--surface2); padding: 14px 12px; text-align: center; }
.hs-cell .k { font-size: 11px; color: var(--faint); font-weight: 600; margin-bottom: 5px; }
.hs-cell .v { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; }
.hs-cell .v.neg { color: var(--red); }
.cum-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.cum-strip .pill { cursor: default; font-weight: 600; letter-spacing: .2px; }
.cum-strip .pill b { color: var(--text); }
/* ---------- group / spark cards ---------- */
.group { margin-bottom: 8px; }
.group-head { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 2px; user-select: none; }
.group-head .g-ico { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: var(--surface2); }
.group-head h4 { font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; }
.group-head .chev { margin-left: auto; color: var(--faint); font-size: 13px; transition: transform .2s; }
.group.closed .chev { transform: rotate(-90deg); }
.group.closed .cards { display: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; margin-top: 6px; }
.spark-card {
  background: var(--surface); border-radius: 12px; padding: 14px 14px 10px;
  box-shadow: var(--shadow-card); position: relative;
  transition: background .15s, transform .15s;
}
.spark-card:hover { background: var(--elev); transform: translateY(-2px); }
.spark-header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.spark-title { font-size: 12.5px; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spark-current { font-size: 17px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; }
.spark-current.up { color: var(--green); } .spark-current.down { color: var(--red); } .spark-current.flat { color: var(--muted); }
.spark-delta { font-size: 11px; font-weight: 600; color: var(--faint); margin-bottom: 4px; }
.sparkline { height: 56px; display: block; margin-top: 4px; }
.spark-axis-labels { display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px; color: var(--faint); font-weight: 600; }
/* ---------- detail ---------- */
.month-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.month-scroller::-webkit-scrollbar { display: none; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.detail-card { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: var(--shadow-card); }
.detail-card-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; }
.detail-card-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.detail-empty { font-size: 13px; color: var(--faint); padding: 10px 0; }
.detail-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.detail-table th { text-align: left; color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; padding: 0 6px 8px; }
.detail-table td { padding: 9px 6px; border-bottom: 1px solid var(--hairline); }
.detail-table tr:last-child td { border-bottom: none; }
.detail-table td.name { color: var(--muted); }
.detail-table td.val { text-align: right; font-weight: 700; }
.detail-table td.val.neg { color: var(--red); }
.detail-table tr.total-row td { font-weight: 800; color: var(--text); background: var(--surface2); }
.detail-table tr.total-row td:first-child { border-radius: 8px 0 0 8px; }
.detail-table tr.total-row td:last-child { border-radius: 0 8px 8px 0; }
/* ---------- detail matrix ---------- */
.mx-wrap { overflow-x: auto; border-radius: 14px; box-shadow: var(--shadow-card); background: var(--surface); -webkit-overflow-scrolling: touch; }
table.mx { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.mx th, table.mx td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--hairline); }
table.mx thead th { position: sticky; top: 0; z-index: 3; background: var(--elev); color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .3px; border-bottom: 1px solid var(--hairline); }
table.mx .col-item { text-align: left; }
table.mx tbody .item { text-align: left; color: var(--muted); font-weight: 500; position: sticky; left: 0; z-index: 2; background: var(--surface); }
table.mx tbody tr:hover .item { background: var(--surface2); color: var(--text); }
table.mx tbody tr:hover td { background: var(--surface2); }
table.mx td.num { font-weight: 600; }
table.mx td.num.neg { color: var(--red); }
table.mx td.num.na { color: var(--faint); }
table.mx td.num.zero { color: var(--faint); }
table.mx .sec-row td { text-align: left; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--green); background: var(--surface2); position: static; }
table.mx .total-row td { background: rgba(30,215,96,0.06); font-weight: 800; color: var(--text); }
table.mx .total-row .item { background: rgba(30,215,96,0.06); color: var(--text); font-weight: 800; }
table.mx .total-row .num.tot { color: var(--green); }
table.mx .total-row .num.neg { color: var(--red); }
table.mx .col-m { min-width: 82px; }
/* ---------- modal ---------- */
#pwdModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(6px); z-index: 99; align-items: center; justify-content: center; padding: 20px; }
#pwdModal .login-box { padding: 30px 26px 24px; }
#pwdModal .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
#pwdModal .modal-actions .login-btn { flex: 1; }
#pwdModal .login-btn.cancel { background: var(--surface2); color: var(--muted); }
#pmCode { letter-spacing: 2px; text-transform: uppercase; }
.reveal-row { display: flex; align-items: center; gap: 7px; margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); cursor: pointer; justify-content: center; }
.reveal-row input { accent-color: var(--green); width: 15px; height: 15px; }
/* ---------- tooltip / states ---------- */
.spark-tooltip { position: absolute; background: var(--elev); border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow-pop); z-index: 100; pointer-events: none; white-space: nowrap; transform: translate(-50%,-100%); margin-top: -10px; transition: opacity .15s; opacity: 0; }
.spark-tooltip.visible { opacity: 1; }
.spark-tooltip .st-month { font-size: 10.5px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.spark-tooltip .st-value { font-size: 16px; font-weight: 800; }
.spark-tooltip .st-sub { font-size: 11.5px; color: var(--faint); font-weight: 500; margin-top: 2px; }
.spark-tooltip .st-sub b { color: var(--text); font-weight: 700; }
.loading, .error-msg, .no-data { text-align: center; padding: 60px 20px; color: var(--faint); font-size: 14px; }
.error-msg { color: var(--red); }
.loading .spin { width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--surface2); border-top-color: var(--green); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .hero-wrap { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .topbar-in { padding: 10px 14px; gap: 8px; }
  .brand { margin-right: 0; width: 100%; }
  .seg { width: 100%; justify-content: center; }
  .tools { margin-left: auto; }
  .page { padding: 16px 12px 70px; }
  .hero-card { padding: 18px 16px 12px; }
  .hero-stats { grid-template-columns: 1fr 1fr; }
  .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
  .spark-current { font-size: 15px; }
}
@media (max-width: 380px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">💵</div>
    <h2>我的工资</h2>
    <p>私有数据 · 请输入密码查看</p>
    <input type="password" class="login-input" id="pwdInput" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">进 入</button>
    <div class="login-error" id="loginError"></div>
    <p class="login-forgot"><a href="javascript:void(0)" onclick="openPwdModal('recover')">忘记密码？用恢复码重置</a></p>
  </div>
</div>

<!-- Password Modal (输入全程遮蔽, 可勾选显示) -->
<div id="pwdModal">
  <div class="login-box" style="max-width:360px">
    <h2 id="pmTitle" style="font-size:19px">改密码</h2>
    <p style="margin-bottom:16px" id="pmHint">设置新的访问密码</p>
    <input type="text" class="login-input" id="pmCode" placeholder="恢复码 XXXX-XXXX-XXXX" autocomplete="off" style="display:none;letter-spacing:2px;text-transform:uppercase">
    <input type="password" class="login-input" id="pmP1" placeholder="新密码（至少6位）" autocomplete="new-password">
    <input type="password" class="login-input" id="pmP2" placeholder="再输一次确认" autocomplete="new-password">
    <label class="reveal-row"><input type="checkbox" id="pmReveal" onchange="pmToggleReveal()">显示输入内容</label>
    <div class="login-error" id="pmErr" style="min-height:18px"></div>
    <div class="modal-actions">
      <button class="login-btn" id="pmOk">确认</button>
      <button class="login-btn cancel" id="pmCancel">取消</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div class="app" id="mainApp">
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand"><span class="brand-dot">💵</span>我的工资</div>
      <div class="seg" id="tabs">
        <button class="pill tab on" data-tab="dashboard">总览</button>
        <button class="pill tab" data-tab="detail">明细</button>
      </div>
      <div class="seg" id="rangeSeg">
        <button class="pill rng" data-r="6">近6月</button>
        <button class="pill rng on" data-r="0">全部</button>
      </div>
      <div class="tools">
        <button class="pill ghost" onclick="openPwdModal('change')" style="height:38px">改密码</button>
        <button class="icon-btn" onclick="doLogout()" title="退出">⏻</button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">☀️</button>
      </div>
    </div>
  </div>
  <div class="page"><main id="app"></main></div>
</div>

<script>
const API_BASE = 'https://bqhnrmcrcvsmrxyxdymx.supabase.co/functions/v1';
const AUTH_KEY = 'salary-session';  // 存的是服务端签发的会话票, 非明文标记

let allData = [];
let periods = [];
let currentTab = 'dashboard';
let rangeMonths = 0;         // 时间范围筛选: 6=近6月 / 0=全部(默认)
let dataLoaded = false;
let collapsedGroups = {};    // 分组折叠状态
let SID = 0;                 // svg gradient id 计数器

// ===== Auth =====
function getSession() {
  try { return localStorage.getItem(AUTH_KEY); } catch(e) { return null; }
}
function checkAuth() { return !!getSession(); }

async function doLogin() {
  const val = document.getElementById('pwdInput').value;
  const err = document.getElementById('loginError');
  err.textContent = '登录中…';
  try {
    const res = await fetch(`${API_BASE}/payslip-auth`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', password: val })
    });
    if (res.status === 401) { err.textContent = '密码错误，请重试'; document.getElementById('pwdInput').value = ''; document.getElementById('pwdInput').focus(); return; }
    if (!res.ok) { err.textContent = '登录服务异常(' + res.status + ')'; return; }
    const d = await res.json();
    try { localStorage.setItem(AUTH_KEY, d.token); } catch(e) {}
    err.textContent = '';
    dataLoaded = false;
    showApp();
  } catch (e) { err.textContent = '网络错误: ' + e.message; }
}

function doLogout() {
  try { localStorage.removeItem(AUTH_KEY); } catch(e) {}
  showLogin();
}

// ===== 密码弹窗 (遮蔽输入) =====
let pmMode = 'change';
function openPwdModal(mode) {
  pmMode = mode;
  document.getElementById('pmTitle').textContent = mode === 'recover' ? '用恢复码重置密码' : '改密码';
  document.getElementById('pmHint').textContent = mode === 'recover' ? '输入恢复码，设置新密码' : '设置新的访问密码（至少6位）';
  document.getElementById('pmCode').style.display = mode === 'recover' ? 'block' : 'none';
  document.getElementById('pmErr').textContent = '';
  document.getElementById('pmP1').value = ''; document.getElementById('pmP2').value = ''; document.getElementById('pmCode').value = '';
  document.getElementById('pmReveal').checked = false; pmToggleReveal();
  document.getElementById('pwdModal').style.display = 'flex';
  document.getElementById(mode === 'recover' ? 'pmCode' : 'pmP1').focus();
}
function closePwdModal() { document.getElementById('pwdModal').style.display = 'none'; }
function pmToggleReveal() {
  const t = document.getElementById('pmReveal').checked ? 'text' : 'password';
  document.getElementById('pmP1').type = t; document.getElementById('pmP2').type = t;
}
async function pmSubmit() {
  const err = document.getElementById('pmErr');
  const p1 = document.getElementById('pmP1').value.trim(), p2 = document.getElementById('pmP2').value.trim();
  const code = document.getElementById('pmCode').value.trim();
  if (p1.length < 6) { err.textContent = '密码至少6位'; return; }
  if (p1 !== p2) { err.textContent = '两次输入不一致'; return; }
  const body = pmMode === 'recover' ? { action: 'recover', code, new_password: p1 } : { action: 'change', new_password: p1 };
  const hdrs = { 'Content-Type': 'application/json' };
  if (pmMode === 'change') hdrs['x-payslip-session'] = getSession() || '';
  err.textContent = '提交中…';
  try {
    const res = await fetch(`${API_BASE}/payslip-auth`, { method: 'POST', headers: hdrs, body: JSON.stringify(body) });
    const d = await res.json().catch(() => ({}));
    if (res.status === 401) { err.textContent = pmMode === 'recover' ? '恢复码不正确' : '会话已过期，请重新登录'; return; }
    if (!res.ok || d.status !== 'OK') { err.textContent = '失败：' + (d.msg || res.status); return; }
    if (d.new_recovery_code) {
      closePwdModal();
      showLogin();
      document.getElementById('loginError').textContent = '密码已重置，请用新密码登录';
      alert('已重置！请把新恢复码抄好（只显示这一次）：\n\n' + d.new_recovery_code);
    } else {
      alert('密码已更新。本次仍保持登录，下次请用新密码进入。');
      closePwdModal();
    }
  } catch (e) { err.textContent = '网络错误：' + e.message; }
}
document.addEventListener('DOMContentLoaded', () => {
  const ok = document.getElementById('pmOk'), cancel = document.getElementById('pmCancel');
  if (ok) ok.onclick = pmSubmit;
  if (cancel) cancel.onclick = closePwdModal;
});

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  const inp = document.getElementById('pwdInput');
  if (inp) { inp.value = ''; inp.focus(); }

  if (err) err.textContent = '';

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

// ===== Data =====
async function fetchData() {
  const res = await fetch(`${API_BASE}/payslip-read`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-payslip-session': getSession() || '' },
    body: '{}'
  });
  if (res.status === 401) { doLogout(); throw new Error('会话已过期，请重新登录'); }
  if (!res.ok) throw new Error(`服务错误: ${res.status}`);
  const d = await res.json();
  if (d.status !== 'OK') throw new Error(d.msg || '读取失败');
  return d.rows;
}

async function loadData() {
  document.getElementById('app').innerHTML = '<div class="loading"><div class="spin"></div>读取数据中…</div>';
  try {
    allData = await fetchData();
    if (!Array.isArray(allData) || allData.length === 0) {
      document.getElementById('app').innerHTML = '<div class="no-data">暂无数据</div>';
      return;
    }
    periods = [...new Set(allData.map(d => d.period))].sort();
    dataLoaded = true;
    render();
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="error-msg">加载失败: ${err.message}</div>`;
  }
}

// ===== Helpers =====
function fmt(n) {
  const v = Math.abs(n);
  return (n < 0 ? '-' : '') + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtShort(n) {
  const v = Math.abs(n);
  if (v >= 10000) return (n < 0 ? '-' : '') + (v / 10000).toFixed(1) + '万';
  return fmt(n);
}
function fmtInt(n) {
  const v = Math.round(n);
  return (n < 0 ? '-' : '') + Math.abs(v).toLocaleString('zh-CN');
}
function periodLabel(p) { return p.slice(2, 4) + '/' + p.slice(4, 6); }

// 当前时间窗口内的月份(受 range 筛选)
function windowPeriods() {
  if (!rangeMonths || rangeMonths >= periods.length) return periods.slice();
  return periods.slice(-rangeMonths);
}

function getItemValue(period, nameMatch, categoryMatch) {
  const clean = s => s.replace(/\s+/g, '');
  const name = clean(nameMatch);
  const item = allData.find(d =>
    d.period === period &&
    (categoryMatch ? clean(d.category).includes(clean(categoryMatch)) : true) &&
    clean(d.item_name) === name);
  if (item) return item.item_value;
  const item2 = allData.find(d =>
    d.period === period &&
    (categoryMatch ? clean(d.category).includes(clean(categoryMatch)) : true) &&
    clean(d.item_name).endsWith(name) && clean(d.item_name).length <= name.length + 3);
  if (item2) return item2.item_value;
  const item3 = allData.find(d =>
    d.period === period &&
    (categoryMatch ? clean(d.category).includes(clean(categoryMatch)) : true) &&
    clean(d.item_name).startsWith(name));
  return item3 ? item3.item_value : 0;
}
function getNetPay(period)     { return getItemValue(period, '税后实发', '税后'); }
function getGrossTotal(period) { return getItemValue(period, '总计', '税前收入'); }
function getTax(period)        { return getItemValue(period, '工资税', '个人所得税'); }
function getDeductionTotal(period) { return Math.abs(getItemValue(period, '总计', '税前工资扣除')); }
function getSeries(nameMatch, categoryMatch, count) {
  const recent = windowPeriods().slice(-count);
  return recent.map(p => getItemValue(p, nameMatch, categoryMatch));
}

// ===== Sparkline SVG (平滑曲线 + 渐变面积; 按真实像素宽绘制, 杜绝拉伸) =====
const SPARKREG = {};   // sid -> {kind, ...spec} 渲染时先占位, 插入DOM后测宽再绘制
function catmullCmds(pts) {
  let s = '';
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    s += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return s;
}
function smoothPath(pts) {
  if (pts.length < 2) return '';
  return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}` + catmullCmds(pts);
}

function buildSparkline(values, isUp, months, w) {
  const count = values.length;
  if (count < 2) return '<div class="sparkline"></div>';
  w = Math.max(120, Math.round(w || 200));
  const h = 56, padX = 10, padY = 7;
  const usableW = w - padX * 2, usableH = h - padY * 2;
  const isNegative = values.some(v => v < 0);
  const pts = values.map((v, i) => {
    const x = padX + (usableW * i) / (count - 1);
    let y;
    if (isNegative) {
      const av = Math.abs(v), aMin = Math.min(...values.map(Math.abs)), aMax = Math.max(...values.map(Math.abs)), aR = aMax - aMin || 1;
      y = padY + usableH - ((av - aMin) / aR) * usableH;
    } else {
      const min = Math.min(...values), max = Math.max(...values), r = max - min || 1;
      y = padY + usableH - ((v - min) / r) * usableH;
    }
    return { x, y, v, month: months ? months[i] : '' };
  });
  const color = isUp === true ? 'var(--green)' : isUp === false ? 'var(--red)' : 'var(--faint)';
  const solid = isUp === true ? '#1ed760' : isUp === false ? '#f3727f' : '#7c7c7c';
  const gradId = 'sg' + (++SID);
  const line = smoothPath(pts);
  const area = `${line} L${pts[pts.length-1].x.toFixed(1)},${h - padY} L${pts[0].x.toFixed(1)},${h - padY} Z`;
  const circles = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${last ? 3.6 : 2.2}" fill="${solid}" ${last ? `stroke="var(--surface)" stroke-width="2"` : ''}/>`;
  }).join('');
  const hits = pts.map(p => {
    const valStr = p.v < 0 ? '-¥' + fmt(Math.abs(p.v)) : '¥' + fmt(p.v);
    return `<circle class="spark-hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="14" fill="transparent" style="cursor:pointer" data-month="${p.month}" data-value="${valStr}"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="sparkline" style="width:${w}px">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${solid}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${solid}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gradId})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${circles}${hits}
  </svg>`;
}

function trendOf(values) {
  const current = values[values.length - 1], first = values[0];
  const diff = current - first;
  let isUp, trendClass;
  if (Math.abs(diff) < 0.01) { isUp = null; trendClass = 'flat'; }
  else if (first < 0) { isUp = Math.abs(current) > Math.abs(first); trendClass = isUp ? 'up' : 'down'; }
  else if (diff > 0) { isUp = true; trendClass = 'up'; }
  else { isUp = false; trendClass = 'down'; }
  return { current, first, diff, isUp, trendClass };
}

function buildSparkCard(title, values) {
  const recent = windowPeriods().slice(-values.length);
  const { current, diff, isUp, trendClass } = trendOf(values);
  const displayValue = fmtShort(Math.abs(current));
  const arrow = isUp === true ? '↑' : isUp === false ? '↓' : '→';
  const dSign = diff >= 0 ? '+' : '-';
  const dTxt = `区间变化 ${dSign}¥${fmtShort(Math.abs(diff))}`;
  const sid = 'c' + (++SID);
  SPARKREG[sid] = { kind: 'spark', values, isUp, months: recent };
  const axis = recent.map(p => `<span>${periodLabel(p)}</span>`).join('');
  return `<div class="spark-card">
    <div class="spark-header">
      <span class="spark-title">${title}</span>
      <span class="spark-current ${trendClass}">${current < 0 ? '-' : ''}${displayValue} ${arrow}</span>
    </div>
    <div class="spark-delta">${dTxt}</div>
    <div class="spark-holder" data-sp="${sid}"></div>
    <div class="spark-axis-labels">${axis}</div>
  </div>`;
}

// ===== 月度堆叠分解柱 (到手/五险一金/个税 垒成税前; 台阶=段高变化) =====
function buildDualBars(netSeries, socialSeries, taxSeries, months, w) {
  const count = months.length;
  if (count < 1) return '';
  w = Math.max(320, Math.round(w || 600));
  const h = 240, padL = 52, padR = 14, padT = 18, padB = 28;
  const usableW = w - padL - padR, usableH = h - padT - padB;
  const tops = months.map((m, i) => netSeries[i] + socialSeries[i] + taxSeries[i]); // =税前
  const max = Math.max(...tops) * 1.06 || 1;   // 柱必须0基线, 比例才不失真
  const py = v => padT + usableH - (v / max) * usableH;
  const slot = usableW / count;
  const bw = Math.min(56, slot * 0.58);
  const C_NET = '#1ed760', C_SOC = '#539df5', C_TAX = '#ffa42b';
  let grid = '';
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const val = (max * t) / ticks, y = py(val);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--hairline)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--faint)" font-weight="600">${fmtY(val)}</text>`;
  }
  const bars = months.map((m, i) => {
    const cx = padL + slot * i + slot / 2, x0 = cx - bw / 2;
    const yNet = py(netSeries[i]), ySoc = py(netSeries[i] + socialSeries[i]), yTop = py(tops[i]);
    const r = Math.min(4, bw / 6);
    return `
      <rect x="${x0.toFixed(1)}" y="${yNet.toFixed(1)}" width="${bw.toFixed(1)}" height="${(py(0)-yNet).toFixed(1)}" fill="${C_NET}" opacity="0.92"/>
      <rect x="${x0.toFixed(1)}" y="${ySoc.toFixed(1)}" width="${bw.toFixed(1)}" height="${(yNet-ySoc).toFixed(1)}" fill="${C_SOC}" opacity="0.85"/>
      <rect x="${x0.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${(ySoc-yTop).toFixed(1)}" fill="${C_TAX}" opacity="0.9" rx="${r}" ry="${r}"/>
      <rect x="${x0.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.min(6,(ySoc-yTop)).toFixed(1)}" fill="${C_TAX}" opacity="0.9"/>
      <text x="${cx.toFixed(1)}" y="${(yTop-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--muted)">${fmtShort(tops[i])}</text>
      <text x="${cx.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--faint)" font-weight="600">${periodLabel(m)}</text>
      <rect class="dual-hit" x="${(cx-slot/2).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${h}" fill="transparent" style="cursor:pointer"
        data-month="${m}" data-net="¥${fmt(netSeries[i])}" data-soc="¥${fmt(socialSeries[i])}" data-tax="¥${fmt(taxSeries[i])}" data-gross="¥${fmt(tops[i])}"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="dual-svg">${grid}${bars}</svg>`;
}
// Y轴刻度金额(千分, 无小数)
function fmtY(v) {
  if (v >= 10000) return (v/10000).toFixed(1) + '万';
  return Math.round(v).toLocaleString('zh-CN');
}

// 两遍绘制: 渲染时先放占位 holder, 插入DOM后测真实宽度再画 (杜绝 viewBox 拉伸)
function paintSparks() {
  document.querySelectorAll('[data-sp]').forEach(holder => {
    const spec = SPARKREG[holder.dataset.sp];
    if (!spec) return;
    const w = holder.clientWidth || 200;
    holder.innerHTML = spec.kind === 'bars'
      ? buildDualBars(spec.net, spec.soc, spec.tax, spec.months, w)
      : buildSparkline(spec.values, spec.isUp, spec.months, w);
  });
}

function renderDashboard() {
  const win = windowPeriods();
  const latest = periods[periods.length - 1];
  const prev = win.length > 1 ? win[win.length - 2] : (periods.length > 1 ? periods[periods.length - 2] : null);

  const net = getNetPay(latest), gross = getGrossTotal(latest), tax = getTax(latest), ded = getDeductionTotal(latest);
  const prevNet = prev ? getNetPay(prev) : 0;
  const netDiff = net - prevNet;

  const taxRate = gross > 0 ? (tax / gross) * 100 : 0;
  const netRatio = gross > 0 ? (net / gross) * 100 : 0;

  const totalGross = win.reduce((s, p) => s + getGrossTotal(p), 0);
  const totalNet = win.reduce((s, p) => s + getNetPay(p), 0);
  const avgNet = win.length ? totalNet / win.length : 0;
  const winLabel = win.length === periods.length ? '全部' : win.length + '个月';

  const netSeries = win.map(p => getNetPay(p));
  const socialSeries = win.map(p => getDeductionTotal(p));
  const taxSeries = win.map(p => Math.abs(getTax(p)));
  const grossSeries = win.map((p, i) => netSeries[i] + socialSeries[i] + taxSeries[i]);
  const gapPct = gross > 0 ? ((gross - net) / gross) * 100 : 0;
  const hid = 'd' + (++SID);
  SPARKREG[hid] = { kind: 'bars', net: netSeries, soc: socialSeries, tax: taxSeries, months: win };
  const heroCard = `<div class="hero-card net">
    <div class="hero-top">
      <div>
        <div class="hero-label">当月（${periodLabel(latest)}）</div>
        <div class="hero-nums">
          <span class="hn hn-net"><i></i>到手 <b>¥${fmt(net)}</b> ${netDiff !== 0 ? `<em class="${netDiff > 0 ? 'up' : 'down'}">${netDiff > 0 ? '▲' : '▼'}${fmt(Math.abs(netDiff))}</em>` : ''}</span>
          <span class="hn hn-gross"><i></i>税前 <b>¥${fmt(gross)}</b></span>
        </div>
      </div>
      <div class="hero-gap"><div class="k">当月被扣比例</div><div class="v">${gapPct.toFixed(1)}%</div></div>
    </div>
    <div class="dual-holder" data-sp="${hid}"></div>
    <div class="dual-legend"><span><i class="lg-net"></i>到手</span><span><i class="lg-soc"></i>五险一金</span><span><i class="lg-tax"></i>个税</span><span class="lg-hint">柱顶=税前 · 点柱看四项</span></div>
  </div>`;

  const groupsHtml = GROUPS.map(g => {
    const closed = collapsedGroups[g.id] ? 'closed' : '';
    const cards = g.items.map(([label, match, cat]) => buildSparkCard(label, getSeries(match, cat, win.length))).join('');
    return `<div class="group ${closed}" data-g="${g.id}">
      <div class="section-label">
        <div class="group-head" data-head="${g.id}" style="width:100%">
          <span class="g-ico">${g.icon}</span><h4>${g.name}</h4>
          <span class="chip">${g.items.length} 项</span>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join('');

  return `
    <div class="hero-wrap">
      ${heroCard}
    </div>
    <div class="hero-stats">
      <div class="hs-cell"><div class="k">个税</div><div class="v neg">${fmtInt(tax)}</div></div>
      <div class="hs-cell"><div class="k">五险一金</div><div class="v neg">-${fmtInt(ded)}</div></div>
      <div class="hs-cell"><div class="k">税率</div><div class="v" style="color:var(--orange)">${taxRate.toFixed(1)}%</div></div>
      <div class="hs-cell"><div class="k">到手率</div><div class="v" style="color:var(--green)">${netRatio.toFixed(1)}%</div></div>
    </div>
    <div class="cum-strip">
      <span class="pill">${winLabel}累计税前 <b>¥${fmtInt(totalGross)}</b></span>
      <span class="pill">${winLabel}累计到手 <b>¥${fmtInt(totalNet)}</b></span>
      <span class="pill">月均到手 <b>¥${fmtInt(avgNet)}</b></span>
    </div>
    ${groupsHtml}
  `;
}

  { label: '失业保险',        cat: '税前工资扣除', name: '失业保险员工实缴' },
  { label: '医疗保险',        cat: '税前工资扣除', name: '医疗保险员工实缴' },
  { label: '住房公积金',      cat: '税前工资扣除', name: '住房公积金员工实缴' },
  { label: '总计 税前扣除',   cat: '税前工资扣除', name: '总计 税前扣除', total: true },
  { label: '赡养老人扣减',    cat: '个人所得税', name: '赡养老人扣减金额' },
  { label: '月工资税基',      cat: '个人所得税', name: '月工资税基' },
  { label: '工资税',          cat: '个人所得税', name: '工资税' },
  { sec: '税后实发' },      // 4 + 5 合并
  { label: '税后实发合计',    cat: '税后', name: '税后实发合计', total: true },
  { sec: '参数' },
  { label: '公积金基数',      cat: '参数', name: '公积金基数' },
  { label: '社会保险基数',    cat: '参数', name: '社会保险基数' },
  { label: '基本工资/天',     cat: '参数', name: '基本工资/天' },
  { label: '津贴/天',         cat: '参数', name: '津贴/天' },
  { label: '加班费/每小时',   cat: '参数', name: '加班费/每小时' },
  { label: '病假扣款/天(10-180)',  cat: '参数', name: '病假扣款/每日 (10-180天)' },
  { label: '病假扣款/天(>180)',    cat: '参数', name: '病假扣款/每日 (180 天以上)' },
  { label: '自动缺勤扣款/天', cat: '参数', name: '自动缺勤每日扣款金额' },
];

// 精确按 (类别含cat, 项目=name) 取值, 找不到返回 null(矩阵里显空)
function cellVal(period, cat, name) {
  const clean = s => String(s || '').replace(/\s+/g, '');
  const hit = allData.find(d => d.period === period && clean(d.category).includes(clean(cat)) && clean(d.item_name) === clean(name));
  return hit ? hit.item_value : null;
}

function renderDetail() {
  const win = windowPeriods();
  const head = win.map(p => `<th class="col-m">${periodLabel(p)}</th>`).join('');
  let body = '';
  for (const r of DETAIL_ROWS) {
    if (r.sec) { body += `<tr class="sec-row"><td class="item" colspan="${win.length + 1}">${r.sec}</td></tr>`; continue; }
    const tds = win.map(p => {
      const v = cellVal(p, r.cat, r.name);
      if (v === null || v === 0) return `<td class="num ${v === null ? 'na' : 'zero'}">${v === null ? '—' : '0'}</td>`;
      return `<td class="num ${v < 0 ? 'neg' : ''} ${r.total ? 'tot' : ''}">${fmtInt(v)}</td>`;
    }).join('');
    body += `<tr class="${r.total ? 'total-row' : ''}"><td class="item">${r.label}</td>${tds}</tr>`;
  }
  return `
    <div class="mx-wrap">
      <table class="mx">
        <thead><tr><th class="col-item">项目（元）</th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

// ===== Sparkline tooltip =====
let sparkTooltipEl = null, sparkTooltipTimer = null;
function ensureSparkTooltip() {
  if (sparkTooltipEl) return sparkTooltipEl;
  sparkTooltipEl = document.createElement('div');
  sparkTooltipEl.className = 'spark-tooltip';
  sparkTooltipEl.innerHTML = '<div class="st-month"></div><div class="st-value"></div>';
  document.body.appendChild(sparkTooltipEl);
  return sparkTooltipEl;
}
function showSparkTooltip(hitArea, cardEl) {
  const tt = ensureSparkTooltip();
  tt.querySelector('.st-month').textContent = hitArea.dataset.month ? periodLabel(hitArea.dataset.month) : '';
  tt.querySelector('.st-value').textContent = hitArea.dataset.value;
  const cardRect = cardEl.getBoundingClientRect();
  const hitRect = hitArea.getBoundingClientRect();
  let left = hitRect.left + hitRect.width / 2;
  tt.style.left = left + 'px';
  tt.style.top = hitRect.top + window.scrollY - 10 + 'px';
  tt.classList.add('visible');
  requestAnimationFrame(() => {
    const ttRect = tt.getBoundingClientRect(), halfW = ttRect.width / 2;
    if (left - halfW < cardRect.left) left = cardRect.left + halfW;
    if (left + halfW > cardRect.right) left = cardRect.right - halfW;
    tt.style.left = left + 'px';
  });
}
function hideSparkTooltip() { if (sparkTooltipEl) sparkTooltipEl.classList.remove('visible'); }
function showDualTooltip(hitEl) {
  const tt = ensureSparkTooltip();
  const d = hitEl.dataset;
  tt.innerHTML = `<div class="st-month">${periodLabel(d.month)}</div>
    <div class="st-value" style="color:var(--green)">到手 ${d.net}</div>
    <div class="st-sub">税前 <b>${d.gross}</b></div>
    <div class="st-sub">五险一金 <b style="color:#539df5">${d.soc}</b> · 个税 <b style="color:#ffa42b">${d.tax}</b></div>`;
  const r = hitEl.getBoundingClientRect();
  tt.style.left = (r.left + r.width / 2) + 'px';
  tt.style.top = r.top + window.scrollY - 6 + 'px';
  tt.classList.add('visible');
}
function attachSparkInteractions() {
  document.querySelectorAll('.dual-hit').forEach(ha => {
    ha.addEventListener('mouseenter', () => { clearTimeout(sparkTooltipTimer); showDualTooltip(ha); });
    ha.addEventListener('mouseleave', () => { sparkTooltipTimer = setTimeout(hideSparkTooltip, 200); });
    ha.addEventListener('click', (e) => { e.stopPropagation(); showDualTooltip(ha); });
    ha.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); showDualTooltip(ha); }, { passive: false });
  });
  document.querySelectorAll('.spark-hit').forEach(ha => {
    const card = ha.closest('.spark-card, .hero-card');
    if (!card) return;
    ha.addEventListener('mouseenter', () => { clearTimeout(sparkTooltipTimer); showSparkTooltip(ha, card); });
    ha.addEventListener('mouseleave', () => { sparkTooltipTimer = setTimeout(hideSparkTooltip, 200); });
    ha.addEventListener('click', (e) => { e.stopPropagation(); showSparkTooltip(ha, card); });
    ha.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); showSparkTooltip(ha, card); }, { passive: false });
  });
  document.querySelectorAll('.group-head').forEach(h => {
    h.addEventListener('click', () => toggleGroup(h.dataset.head));
  });
  if (!attachSparkInteractions._bound) {
    document.addEventListener('click', (e) => { if (!e.target.closest('.spark-hit')) hideSparkTooltip(); });
    document.addEventListener('touchstart', (e) => { if (!e.target.closest('.spark-hit')) hideSparkTooltip(); }, { passive: true });
    attachSparkInteractions._bound = true;
  }
}

// ===== Main render =====
function toggleGroup(id) { collapsedGroups[id] = !collapsedGroups[id]; render(); }

function render() {
  const app = document.getElementById('app');
  if (allData.length === 0) { app.innerHTML = '<div class="loading"><div class="spin"></div></div>'; return; }
  app.innerHTML = currentTab === 'dashboard' ? renderDashboard() : renderDetail();
  if (currentTab === 'dashboard') { paintSparks(); attachSparkInteractions(); }
}

// 窗口尺寸变化时按新宽度重绘 (holder 规格仍在 SPARKREG)
let rzTimer = null;
window.addEventListener('resize', () => {
  if (currentTab !== 'dashboard') return;
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => { paintSparks(); attachSparkInteractions(); }, 150);
});

// ===== Tab & range =====
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on');
  currentTab = tab.dataset.tab;
  render();
  window.scrollTo(0, 0);
});
document.getElementById('rangeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('.rng');
  if (!b) return;
  document.querySelectorAll('#rangeSeg .rng').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  rangeMonths = Number(b.dataset.r);
  render();
});

// ===== Theme =====
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('salary-theme', next); } catch(e) {}
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
(function initTheme() {
  let saved;
  try { saved = localStorage.getItem('salary-theme'); } catch(e) {}
  applyTheme(saved || 'dark');   // 默认深色
})();

// ===== Init =====
(function init() {
  if (checkAuth()) showApp(); else showLogin();
})();
</script>
